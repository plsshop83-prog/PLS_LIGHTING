<style.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
backdrop-filter:blur(8px);
justify-content:center;
align-items:center;
z-index:9999;
}

.popup-box{
width:85%;
max-width:350px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(20px);
border-radius:20px;
padding:20px;
text-align:center;

}

.popup-box h3{
color:#fff;
margin-bottom:15px;
}

.popup-btn{
display:block;
padding:14px;
margin:10px 0;
background:#14b8a6;
color:#fff;
border-radius:12px;
text-decoration:none;
font-size:18px;
}

.close-btn{
margin-top:10px;
padding:10px 20px;
border:none;

background:#ff4d4d;
color:#fff;
font-size:16px;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{

background:linear-gradient(180deg,#063d34,#0b5a49,#0d7058);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

color:white;

}

.card{

width:100%;

max-width:420px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.15);

backdrop-filter:blur(15px);

border-radius:28px;

padding:35px 25px;

text-align:center;

box-shadow:0 20px 50px rgba(0,0,0,.35);

animation:fade 1s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.logo{

width:150px;

height:150px;

border-radius:50%;

object-fit:cover;

border:4px solid #d4af37;

box-shadow:0 0 35px rgba(212,175,55,.45);

margin-bottom:20px;

}

h1{

font-size:34px;

letter-spacing:2px;

color:#d4af37;

margin-bottom:8px;

}

.subtitle{

font-size:16px;

color:#ffffff;

opacity:.9;

margin-bottom:5px;

}

.slogan{

color:#d4af37;

font-weight:bold;

margin-bottom:30px;

}

.line{

width:120px;

height:3px;

background:#d4af37;

margin:auto;

border-radius:20px;

margin-bottom:25px;

}

.btn{

display:block;

text-decoration:none;

color:white;

background:rgba(255,255,255,.08);

padding:16px;

margin:14px 0;

border-radius:16px;

transition:.35s;

font-weight:600;

border:1px solid rgba(255,255,255,.08);

}

.btn:hover{

background:#d4af37;

color:#063d34;

transform:scale(1.03);

}

.footer{

margin-top:35px;

font-size:13px;

opacity:.7;

}

</style>
